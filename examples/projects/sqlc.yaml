# Typed queries: SQL in queries/, the schema from this service's own
# migrations/, generated Go in internal/store. Regenerate with generate.sh
# (scripts/generate.sh runs it); never edit the output by hand.
version: '2'
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
