openapi: 3.0.3
info:
  title: identity
  version: 1.0.0
  description: |
    The identity service: sign-in through an organization's identity
    provider, the sessions that follow, and the tokens every other service
    verifies. This contract is the source of truth: the Go server interface
    and the TypeScript client are both generated from it.

    Every error is the same envelope, `{ code, message, fields? }`. Codes are
    stable; messages are for people and are never parsed.
servers:
  - url: /identity
paths:
  /v1/jwks:
    get:
      operationId: getJwks
      summary: The public keys platform tokens are signed with
      security: []
      tags: [keys]
      responses:
        '200':
          description: A JWK set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/start:
    get:
      operationId: startSignIn
      summary: Begin sign-in through an organization's identity provider
      description: |
        Which organization: by id, or by the domain of the address the
        person typed. Redirects the browser to the provider. `next` is the
        path in the app to return to; `app` is which web app asked.

        The desktop app and the mobile app open this in the
        system browser with `client=desktop` or `client=mobile` and a PKCE
        challenge of their own: the callback then
        starts no session in that browser, and instead sends the browser to
        the app's scheme with a one-time code the app exchanges at
        `POST /v1/sign-in/exchange`.
      security: []
      tags: [sign-in]
      parameters:
        - name: org_id
          in: query
          schema:
            type: string
            format: uuid
        - name: email
          in: query
          schema:
            type: string
            maxLength: 320
        - name: next
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: app
          in: query
          schema:
            type: string
            description: One of the configured web apps; the main app (account, unless the deployment names others) when left out.
        - name: client
          in: query
          schema:
            type: string
            enum: [web, desktop, mobile]
            default: web
        - name: code_challenge
          in: query
          description: The desktop app's PKCE challenge, base64url SHA-256 of its verifier. Required with client=desktop.
          schema:
            type: string
            minLength: 43
            maxLength: 128
        - name: code_challenge_method
          in: query
          description: Only S256.
          schema:
            type: string
            enum: [S256]
      responses:
        '302':
          description: To the identity provider
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: No organization for that domain, or the organization has no identity provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/methods:
    get:
      operationId: signInMethods
      summary: How an address signs in, before anyone has proven who they are
      description: |
        The sign-in page cannot know which organization someone belongs to
        before they say who they are, so it asks by address. A domain
        claimed by an organization with an identity provider signs in
        through it (`entra`); anything else (a local organization or an
        unknown domain) signs in with a password (`local`). Nothing
        else is said: no organization's name or existence is revealed to
        someone who has not signed in. Rate limited by address.
      security: []
      tags: [sign-in]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            maxLength: 320
      responses:
        '200':
          description: The method
          content:
            application/json:
              schema:
                type: object
                required: [method]
                properties:
                  method:
                    type: string
                    enum: [entra, local]
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/callback:
    get:
      operationId: finishSignIn
      summary: The identity provider sends the browser back here
      description: |
        Exchanges the code, validates the identity token, records the
        sign-in with the user service, starts a session, and redirects to
        the app. The session is a cookie on this host; the app then asks
        `POST /v1/session/refresh` for an access token. No token ever
        travels in a URL.
      security: []
      tags: [sign-in]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        '302':
          description: To the app, or to the app's sign-in page with an error code
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/session/refresh:
    post:
      operationId: refreshSession
      summary: An access token for the session in the cookie
      description: |
        Rotates the refresh token. The access token carries the session's
        active membership; when the person has several organizations and
        none is active yet, `choose_organization` says the app must show
        the chooser and the token carries no organization.
      security: []
      tags: [session]
      responses:
        '200':
          description: The access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/session/memberships:
    get:
      operationId: listSessionMemberships
      summary: The organizations the signed-in person may switch to
      security: []
      tags: [session]
      responses:
        '200':
          description: The memberships, most recently active first
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionMembership'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/session/switch:
    post:
      operationId: switchOrganization
      summary: Make another of the person's organizations the active one
      description: Switches the session's membership without another sign-in, and answers with a token for it.
      security: []
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The access token for the new active membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: The person has no active membership in that organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/session/sign-out:
    post:
      operationId: signOut
      summary: End the session in the cookie
      security: []
      tags: [session]
      responses:
        '204':
          description: Signed out; the cookie is cleared
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/identity-provider:
    get:
      operationId: getIdentityProvider
      summary: The organization's identity provider, without its secret
      description: Needs the sso permission, as changing it does.
      security:
        - bearer: []
      tags: [identity-providers]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setIdentityProvider
      summary: Configure the organization's identity provider
      description: |
        The credentials are checked with a real round trip to the provider's
        discovery document before anything is saved; the client secret is
        encrypted under the organization's data key and never returned.
        Audited. Needs the sso permission (an Owner, an Admin with it, or a
        platform operator).
      security:
        - bearer: []
      tags: [identity-providers]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewIdentityProvider'
      responses:
        '200':
          description: The provider, verified and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProvider'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          description: The provider could not be reached with these settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions:
    get:
      operationId: listSessions
      summary: The signed-in person's live sessions
      description: |
        Every browser and device the person is signed in on, most recently
        seen first, with the one making this request marked. Idle sessions
        are left out; they end on their next refresh.
      security:
        - bearer: []
      tags: [sessions]
      responses:
        '200':
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeOtherSessions
      summary: Sign out everywhere else
      description: |
        Ends every other session of the signed-in person and pushes the
        revocation to any open socket. The session making the request stays;
        `POST /v1/session/sign-out` ends that one. Audited.
      security:
        - bearer: []
      tags: [sessions]
      responses:
        '200':
          description: How many sessions ended
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{session_id}:
    delete:
      operationId: revokeSession
      summary: End one of the signed-in person's sessions
      description: |
        Their own only: someone else's session is not found. Revoking the
        session making the request is allowed and is a sign-out. The
        revocation is pushed to any open socket. Audited.
      security:
        - bearer: []
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Ended
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/session-policy:
    get:
      operationId: getSessionPolicy
      summary: How long the organization's sessions last
      description: The organization's own policy, or the platform's defaults when it has set none, with the range the platform allows.
      security:
        - bearer: []
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPolicy'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setSessionPolicy
      summary: Change how long the organization's sessions last
      description: |
        Needs the settings permission (an Owner, or an Admin). Both values
        must be within the platform's range: an organization cannot make a
        session last forever. Applies to sessions started from now on;
        existing sessions keep the lifetime they were issued with. Audited.
      security:
        - bearer: []
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPolicyUpdate'
      responses:
        '200':
          description: The policy as saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPolicy'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/users/{user_id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: End every session of a person (services only)
      description: |
        For a password change, an MFA reset, or a platform-wide deactivation:
        every live session ends, each revocation is pushed to any open
        socket, and each is audited in the organization that signed it in.
      security:
        - bearer: []
      tags: [internal]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: A stable code for why, for the audit log and the person's screen.
                  maxLength: 100
      responses:
        '200':
          description: How many sessions ended
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/local-accounts:
    post:
      operationId: createLocalAccount
      summary: Start a local account for a person (services only)
      description: |
        For an invite, a bulk import or a self-serve signup in an
        organization without an identity provider. The account starts
        unverified and cannot sign in; a verification link is emailed on the
        organization's behalf. Calling again for the same person sends a
        fresh link and retires the earlier ones; a verified address stays
        verified unless it changed.
      security:
        - bearer: []
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, email, org_id, org_name, app]
              properties:
                user_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  maxLength: 320
                org_id:
                  type: string
                  format: uuid
                org_name:
                  type: string
                  maxLength: 200
                app:
                  type: string
                  description: Which web app the link opens, one of the configured apps (account, admin and platform unless the deployment names others).
                verified:
                  type: boolean
                  default: false
                  description: |
                    The caller has already proven the address (a self-serve
                    signup): no link is sent, the account starts verified,
                    and the answer carries a setup token for the first
                    password.
      responses:
        '200':
          description: The account as it stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalAccount'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/local-accounts/{user_id}:
    get:
      operationId: getLocalAccount
      summary: A person's local account, if they have one (services only)
      security:
        - bearer: []
      tags: [internal]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalAccount'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/email-verification/verify:
    post:
      operationId: verifyEmail
      summary: Prove ownership of an email address
      description: |
        The link in the email carries the token. One use; expired, used or
        unknown tokens are refused the same way. Verifying is what lets a
        local account sign in.
      security: []
      tags: [email-verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [user_id, org_id]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  org_id:
                    type: string
                    format: uuid
                    description: The organization the link was sent for; the app continues there.
                  setup_token:
                    type: string
                    description: |
                      Present when the account has no password yet: the app
                      sends it with the first password to `POST /v1/local/password`.
                      One use, fifteen minutes.
        '400':
          description: The link is not valid any more
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/email-verification/resend:
    post:
      operationId: resendVerification
      summary: Send the verification link again
      description: |
        Always answers 202: whether the address has an account, and whether
        it is already verified, is not something this endpoint tells. A
        person is sent at most a few links an hour; beyond that the request
        is accepted and nothing is sent. Rate limited by address on top.
      security: []
      tags: [email-verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, app]
              properties:
                email:
                  type: string
                  maxLength: 320
                app:
                  type: string
                  description: One of the configured web apps (account, admin and platform unless the deployment names others).
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/exchange:
    post:
      operationId: exchangeDesktopSignIn
      summary: The desktop app takes up a sign-in finished in the system browser
      description: |
        The one-time code the callback sent to the app's scheme, with the
        PKCE verifier whose challenge started the attempt. Single use, and
        good for a minute. Starts the session in the app, sets the session
        cookie as local sign-in does, and answers with the access token.
        Anything wrong is refused alike, with `signin.exchange_invalid`.
      security: []
      tags: [sign-in]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code:
                  type: string
                  maxLength: 200
                code_verifier:
                  type: string
                  minLength: 43
                  maxLength: 128
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/local:
    post:
      operationId: signInLocal
      summary: Sign in with email and password
      description: |
        For organizations without an identity provider. Starts a session and
        answers with the access token, as a refresh would; the session
        cookie is set. A wrong address and a
        wrong password are refused alike. Failed attempts are throttled per
        account and per address; a person who types their password right is
        never slowed. An unverified account is refused until its email is
        verified.
      security: []
      tags: [sign-in]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  maxLength: 320
                password:
                  type: string
                  maxLength: 200
                app:
                  type: string
                  description: One of the configured web apps; the main app (account, unless the deployment names others) when left out.
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '202':
          description: The password is right and a second factor is due, or must be set up first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: Refused; the code says whether it was the credentials, an unverified email, or no organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed attempts for this account or address; try later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/mfa:
    post:
      operationId: signInMfa
      summary: Finish a sign-in with a second factor
      description: |
        The challenge token from the local sign-in, and a code from the
        authenticator app or one of the recovery codes. Right: the session
        starts and the access token is answered, as the sign-in would have.
        Wrong: refused, counted against the account like a wrong password.
        The challenge lasts five minutes.
      security: []
      tags: [sign-in]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token:
                  type: string
                  maxLength: 200
                code:
                  type: string
                  maxLength: 20
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: The code is wrong, or the challenge has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many wrong codes; try later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/mfa/enroll:
    post:
      operationId: enrollMfaAtSignIn
      summary: Set up an authenticator before the first sign-in that requires one
      description: |
        When the organization requires a second factor and the person has
        none, the local sign-in answers with an enrolment token instead of
        a session. This starts the enrolment with it, as `POST /v1/mfa/totp`
        does for a signed-in person; confirming with `POST /v1/mfa/totp/confirm`
        takes the same token in place of a bearer token. Then sign in again.
      security: []
      tags: [sign-in]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token]
              properties:
                enrollment_token:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: The secret to put in the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sign-in/mfa/confirm:
    post:
      operationId: confirmMfaAtSignIn
      summary: Confirm the authenticator set up before the first sign-in
      security: []
      tags: [sign-in]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token, code]
              properties:
                enrollment_token:
                  type: string
                  maxLength: 200
                code:
                  type: string
                  maxLength: 20
      responses:
        '200':
          description: Enrolled; the recovery codes, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/mfa:
    get:
      operationId: getMfa
      summary: The signed-in person's second factor
      security:
        - bearer: []
      tags: [mfa]
      responses:
        '200':
          description: The state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disableMfa
      summary: Turn off the signed-in person's second factor
      description: |
        Needs a current code from the app (or a recovery code). Refused
        when every organization the person belongs to requires a second
        factor. Audited.
      security:
        - bearer: []
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 20
      responses:
        '204':
          description: Off
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: The code is wrong, or an organization requires it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/mfa/totp:
    post:
      operationId: enrollTotp
      summary: Start setting up an authenticator app
      description: |
        A fresh secret, as the app takes it and as an otpauth link to show
        as a QR code. Not in force until confirmed with a code from the
        app. Starting again before confirming replaces the secret; an
        authenticator already confirmed is not replaced here.
      security:
        - bearer: []
      tags: [mfa]
      responses:
        '200':
          description: The secret to put in the app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolment'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: An authenticator is already confirmed; turn it off first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Confirm the authenticator with a code from it
      description: In force from here on. Answers with the recovery codes, shown once. Audited.
      security:
        - bearer: []
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 20
      responses:
        '200':
          description: Enrolled; the recovery codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: Nothing to confirm; start with `POST /v1/mfa/totp`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: A fresh set of recovery codes, replacing the old
      description: Needs a current code from the app. Shown once. Audited.
      security:
        - bearer: []
      tags: [mfa]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 20
      responses:
        '200':
          description: The new codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: The code is wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/members/{user_id}/sessions:
    get:
      operationId: listMemberSessions
      summary: A member's live sessions, for an admin
      description: The users permission, for a member of the organization. The device and times, never an address.
      security:
        - bearer: []
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: revokeMemberSessions
      summary: Sign a member out everywhere, for an admin
      description: The users permission, for a member of the organization. Every session ends and is pushed to their sockets. Audited.
      security:
        - bearer: []
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: How many sessions ended
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/members/{user_id}/mfa:
    delete:
      operationId: resetMemberMfa
      summary: Reset a member's second factor when they lose their device
      description: |
        The users permission in the organization, for a person who is a
        member of it. Their authenticator and recovery codes are removed and
        every session of theirs ends; they set up a new one at their next
        sign-in (at once, if the organization requires it). Audited.
      security:
        - bearer: []
      tags: [mfa]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Reset
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Not a member, or no second factor to reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/local/password:
    post:
      operationId: setPassword
      summary: Set the password with a setup or reset link
      description: |
        The token is the one email verification answered with (a first
        password) or the one in a reset email. One use. The password must be
        at least twelve characters and not the email address. Setting it
        after a reset ends every session of the person. Audited.
      security: []
      tags: [local-accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  maxLength: 200
                password:
                  type: string
                  maxLength: 200
      responses:
        '204':
          description: Set; sign in with it
        '400':
          description: The link is not valid any more, or the password does not meet the policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/local/password/forgot:
    post:
      operationId: forgotPassword
      summary: Send a password reset link
      description: |
        Always answers 202: whether the address has an account is not
        something this endpoint tells. A person is sent at most a few reset
        links an hour. The link works once and for one hour. Rate limited by
        address on top.
      security: []
      tags: [local-accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, app]
              properties:
                email:
                  type: string
                  maxLength: 320
                app:
                  type: string
                  description: One of the configured web apps (account, admin and platform unless the deployment names others).
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/invites:
    post:
      operationId: createInvite
      summary: Invite someone into the organization
      description: |
        The users permission, for a role the caller may manage (an Owner
        any, an Admin a User); a platform operator may invite the first
        Owner of a new organization. An address that already belongs to a
        member is refused with a reason. An open invite for the same
        address is sent again rather than duplicated. The link works once
        and for the expiry given, seven days by default. Emailed on the
        organization's behalf. Audited.
      security:
        - bearer: []
      tags: [invites]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInvite'
      responses:
        '201':
          description: The invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: The address already belongs to a member of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listInvites
      summary: The organization's invites
      description: |
        Newest first, cursor paginated, by status. The users permission
        lists every invite; any member lists the ones they sent with
        `mine=true`, which is where an inviter extends or revokes them.
      security:
        - bearer: []
      tags: [invites]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, revoked, expired]
        - name: mine
          in: query
          schema:
            type: boolean
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: A page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/invites/{invite_id}/resend:
    post:
      operationId: resendInvite
      summary: Send an open invite again, with a fresh link and expiry
      description: The users permission, or the member who sent it. Audited.
      security:
        - bearer: []
      tags: [invites]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InviteId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_hours:
                  type: integer
                  minimum: 1
                  maximum: 720
      responses:
        '200':
          description: The invite, reissued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: The invite is no longer open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/invites/{invite_id}:
    delete:
      operationId: revokeInvite
      summary: Withdraw an open invite
      description: The users permission, or the member who sent it. The link stops working. Audited.
      security:
        - bearer: []
      tags: [invites]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: Withdrawn
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/invites:
    post:
      operationId: createInternalInvite
      summary: An invite made by another service (services only)
      description: |
        Another service inviting someone into an organization. Same rules
        as the organization's own endpoint.
      security:
        - bearer: []
      tags: [internal]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInternalInvite'
      responses:
        '201':
          description: The invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: The address already belongs to a member of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/invites/{token}:
    get:
      operationId: previewInvite
      summary: What an invite link is for, before accepting it
      security: []
      tags: [invites]
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The invite, as the acceptance page shows it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          description: Not an open invite; the code says whether it was used, withdrawn or has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invite
      description: |
        One use. The membership is made (the user too, on first sight, with
        the name given); a second organization inviting a known address
        gets a second membership, never a second account. Refused when the
        organization is at its plan's user cap, leaving the invite open. The answer says what comes next: sign in
        through the organization's identity provider, verify the email and
        set a password, or sign in with the password the person already has.
      security: []
      tags: [invites]
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: The person's name, used when they are new.
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: Not an open invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The organization is at its plan's user cap; the invite stays open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/memberships/ended:
    post:
      operationId: membershipEnded
      summary: A membership ended (services only)
      description: |
        The user service says so on deactivation, suspension or leaving.
        Every live session carrying that membership moves at once: to
        another of the person's organizations by the landing rule, to the
        chooser, or, when none remain, it is revoked. Either way the person's
        open connections in that organization are told and closed.
      security:
        - bearer: []
      tags: [internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, membership_id, user_id, reason]
              properties:
                org_id:
                  type: string
                  format: uuid
                membership_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                  enum: [deactivated, suspended, left, account_deleted]
      responses:
        '200':
          description: What happened to the sessions
          content:
            application/json:
              schema:
                type: object
                required: [switched, revoked]
                properties:
                  switched:
                    type: integer
                    description: Sessions moved to another organization or the chooser.
                  revoked:
                    type: integer
                    description: Sessions ended because no organization remained.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/organizations/{org_id}/data:
    get:
      operationId: exportOrgData
      security:
        - bearer: []
      summary: Everything this service keeps for an org, for its export (the organization service only)
      description: |
        The identity provider's settings without the client secret, the
        session policy, and the invites without their tokens.
      tags: [internal]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: This service's part of the export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPart'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: purgeOrgData
      security:
        - bearer: []
      summary: Delete everything this service keeps for an org, and count what is left (the organization service only)
      tags: [internal]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Purged; remaining is zero when nothing of the org is left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPurged'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/users/{user_id}/data:
    get:
      operationId: exportUserData
      security:
        - bearer: []
      summary: What this service keeps about one person, for their own export (the organization service only)
      description: |
        The sign-in account without its password, the sessions on record,
        and whether a second factor is enrolled, without its secret.
      tags: [internal]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membership
          in: query
          description: Each of the person's memberships, as org_id:membership_id.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: This service's part of the person's export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPart'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/users/{user_id}:
    delete:
      operationId: deleteUserAccount
      security:
        - bearer: []
      summary: Delete everything this service keeps about a person (the user and organization services only)
      description: |
        For a deleted account or a person whose last organization was
        purged: every session ends and is pushed, then the sign-in account,
        the second factor and any pending links are deleted. Idempotent.
      tags: [internal]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted, or there was nothing
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/organizations/{org_id}/sessions/revoke:
    post:
      operationId: revokeOrgSessions
      security:
        - bearer: []
      summary: End every session working in an organization (the organization service only)
      description: |
        For an organization that is closing: every live session working in
        it ends, and each is pushed to any open socket, so nobody can reach
        it from the moment it closes. Signing in again is refused while it
        is closing.
      tags: [internal]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [organization_closing]
      responses:
        '200':
          description: How many sessions ended
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/email:
    post:
      operationId: requestEmailChange
      security:
        - bearer: []
      summary: Ask to sign in with another email address
      description: |
        A link goes to the new address; nothing changes until it is used,
        within 24 hours. Refused for a person whose address an identity
        provider manages (Entra or SCIM): they change it there. Only a
        local account has an address to change here. At most three links
        an hour.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 320
      responses:
        '202':
          description: The link is on its way to the new address
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          description: The address is managed by an identity provider, there is no local account, or the address is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many links this hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/email-change/confirm:
    post:
      operationId: confirmEmailChange
      summary: Use the link sent to the new address
      description: |
        The address changes everywhere the person signs in. The old address
        is told, with a link that undoes the change within the hour. Works
        once.
      security: []
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeToken'
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChanged'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Somebody else signs in with that address now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/email-change/undo:
    post:
      operationId: undoEmailChange
      summary: Use the link sent to the old address, within the hour
      description: |
        The old address is restored and every session of the person ends,
        in case whoever changed it is signed in.
      security: []
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeToken'
      responses:
        '200':
          description: Undone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChanged'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Somebody else signs in with the old address now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: invite_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        maxLength: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
      description: A retried create with the same key makes nothing new.
  responses:
    Error:
      description: The error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DataPart:
      type: object
      required: [service, data, files]
      properties:
        service:
          type: string
        data:
          type: object
          additionalProperties: true
        files:
          type: array
          items:
            type: object
            required: [key, name]
            properties:
              key:
                type: string
              name:
                type: string
    DataPurged:
      type: object
      required: [remaining]
      properties:
        remaining:
          type: integer
    EmailChangeToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 200
    EmailChanged:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: The address the person signs in with now.
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in, user_id, choose_organization]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires; refresh before then.
        user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        choose_organization:
          type: boolean
          description: True when no organization is active yet and the app must show the chooser.
    SessionMembership:
      type: object
      required: [org_id, membership_id, status, active]
      properties:
        org_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        status:
          type: string
        role:
          type: string
        org_name:
          type: string
          description: The organization's name, for the switcher; the person is a member, so it is theirs to see.
        active:
          type: boolean
          description: Whether this is the session's active membership.
        last_active_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [session_id, current, created_at, last_seen_at, expires_at]
      properties:
        session_id:
          type: string
          format: uuid
        current:
          type: boolean
          description: The session making this request.
        org_id:
          type: string
          format: uuid
          description: The organization active in it, when one is.
        user_agent:
          type: string
          description: The browser or device, as it described itself.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When it ends regardless of use.
        idle_expires_at:
          type: string
          format: date-time
          description: When it ends if not used before then.
    SessionPolicy:
      type: object
      required: [org_id, lifetime_seconds, idle_timeout_seconds, mfa_required, configured, limits]
      properties:
        org_id:
          type: string
          format: uuid
        lifetime_seconds:
          type: integer
          description: A session ends this long after sign-in regardless of use.
        idle_timeout_seconds:
          type: integer
          description: A session ends after this long without use.
        mfa_required:
          type: boolean
          description: Local accounts must have a second factor to sign in to this organization. Entra users get theirs from Microsoft.
        configured:
          type: boolean
          description: False while the organization is on the platform's defaults.
        limits:
          type: object
          required: [min_lifetime_seconds, max_lifetime_seconds, min_idle_timeout_seconds, max_idle_timeout_seconds]
          properties:
            min_lifetime_seconds:
              type: integer
            max_lifetime_seconds:
              type: integer
            min_idle_timeout_seconds:
              type: integer
            max_idle_timeout_seconds:
              type: integer
    SessionPolicyUpdate:
      type: object
      required: [lifetime_seconds, idle_timeout_seconds]
      properties:
        lifetime_seconds:
          type: integer
        idle_timeout_seconds:
          type: integer
        mfa_required:
          type: boolean
          description: Left out keeps what it is.
    NewInvite:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
        role:
          type: string
          default: user
          description: user, admin, billing_admin; owner only by a platform operator.
        app:
          type: string
          description: Which web app the link opens, one of the configured apps; the main app (account, unless the deployment names others) when left out.
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
    NewInternalInvite:
      type: object
      required: [org_id, email]
      properties:
        org_id:
          type: string
          format: uuid
        email:
          type: string
          maxLength: 320
        role:
          type: string
          default: user
        app:
          type: string
          description: Which web app the link opens, one of the configured apps; the main app when left out.
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
        invited_by_membership_id:
          type: string
          format: uuid
          description: The member who asked, when one did.
    Invite:
      type: object
      required: [invite_id, org_id, email, role, status, expires_at, created_at]
      properties:
        invite_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        invited_by_membership_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    InvitePage:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
        next_cursor:
          type: string
    InvitePreview:
      type: object
      required: [org_id, org_name, role, expires_at]
      properties:
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        role:
          type: string
        expires_at:
          type: string
          format: date-time
        email_hint:
          type: string
          description: The address, partly hidden, so the person can tell which account it is for.
    InviteAccepted:
      type: object
      required: [org_id, membership_id, user_id, next]
      properties:
        org_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        next:
          type: string
          enum: [sign_in_entra, verify_email, sign_in]
          description: |
            sign_in_entra: the organization's identity provider signs the person in.
            verify_email: a verification link was sent; verify, then set a password.
            sign_in: the person already has a password; sign in with it.
    MfaChallenge:
      type: object
      required: [mfa]
      properties:
        mfa:
          type: string
          enum: [challenge, enroll]
          description: challenge means a code is due; enroll means an authenticator must be set up first.
        challenge_token:
          type: string
          description: "With mfa=challenge, what to send with the code."
        enrollment_token:
          type: string
          description: "With mfa=enroll, what the enrolment endpoints take in place of a bearer token."
        expires_in:
          type: integer
          description: Seconds the token lasts.
    TotpEnrolment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32, for typing into the app by hand.
        otpauth_uri:
          type: string
          description: For showing as a QR code.
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          description: Each works once. Shown once; keep them somewhere safe.
    MfaStatus:
      type: object
      required: [enrolled, required]
      properties:
        enrolled:
          type: boolean
          description: An authenticator is confirmed.
        confirmed_at:
          type: string
          format: date-time
        recovery_codes_left:
          type: integer
        required:
          type: boolean
          description: The active organization requires a second factor.
    LocalAccount:
      type: object
      required: [user_id, email_verified]
      properties:
        user_id:
          type: string
          format: uuid
        email_verified:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
        setup_token:
          type: string
          description: "With verified, when the account has no password yet: what POST /v1/local/password takes with the first one. One use, fifteen minutes."
    NewIdentityProvider:
      type: object
      required: [type, tenant_id, client_id, client_secret]
      properties:
        type:
          type: string
          enum: [entra]
        tenant_id:
          type: string
          description: The Entra tenant id (a GUID) or verified domain.
          maxLength: 200
        client_id:
          type: string
          maxLength: 200
        client_secret:
          type: string
          maxLength: 1000
    IdentityProvider:
      type: object
      required: [org_id, type, tenant_id, client_id, issuer, status, redirect_uri]
      properties:
        org_id:
          type: string
          format: uuid
        type:
          type: string
        tenant_id:
          type: string
        client_id:
          type: string
        issuer:
          type: string
        status:
          type: string
          enum: [active, disabled]
        verified_at:
          type: string
          format: date-time
        redirect_uri:
          type: string
          description: What to register on the app registration as the redirect URI.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
