openapi: 3.0.3
info:
  title: organization
  version: 1.0.0
  description: |
    The organization service. This contract is the source of truth: the Go
    server interface and the TypeScript client are both generated from it.

    Every error is the same envelope, `{ code, message, fields? }`. Codes are
    stable; messages are for people and are never parsed.
servers:
  - url: /organization
security:
  - bearer: []
paths:
  /v1/organizations:
    post:
      operationId: createOrganization
      summary: Create an organization (platform operators)
      description: |
        The organization is the top-level tenant. It starts on the free plan
        with its first data key. The Idempotency-Key header is required: a
        retried request with the same key returns the organization the first
        one created and never makes a second.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrganization'
      responses:
        '201':
          description: The organization, whether created now or by the first request with this key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: The domain is claimed by another organization, or the key was used for a different request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listOrganizations
      summary: Every organization on the platform, a page at a time (platform operators)
      tags: [organizations]
      parameters:
        - name: cursor
          in: query
          description: The next_cursor of the previous page. Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          description: The field to order by. The sort is stable across pages.
          schema:
            type: string
            enum: [created_at, name]
            default: created_at
        - name: order
          in: query
          description: Newest first by default when sorting by created_at; A to Z by name.
          schema:
            type: string
            enum: [asc, desc]
        - name: q
          in: query
          description: A prefix of the name or the domain, case-insensitive.
          schema:
            type: string
            maxLength: 200
        - name: plan
          in: query
          schema:
            $ref: '#/components/schemas/Plan'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrganizationStatus'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}:
    get:
      operationId: getOrganization
      summary: One organization
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateOrganization
      summary: Change an organization's settings
      description: |
        Only the fields sent change. Sending null for display_name or domain
        clears it. The plan is not a setting; billing changes it.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSettings'
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: The domain is claimed by another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/plans:
    get:
      operationId: listPlans
      summary: The plan catalogue, for the plans and billing pages to render
      description: |
        Every band registered in this deployment, the template's or the
        product's, lowest first, with its label, whether it is contractual,
        its cap on every registered limit (0 means no cap) and the gated
        features it includes; and every registered limit and feature with
        its label. The same for every org; any signed-in caller may read it.
        Read from the registry at the moment of the request, never cached.
      tags: [plans]
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanCatalogue'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/plan:
    get:
      operationId: getOrganizationPlan
      summary: The org's plan, what it allows, and what the org uses now (its members, platform operators)
      description: |
        The band the org is on, with its label and whether it is
        contractual; the effective cap on every registered limit (0 means no
        cap) and the gated features on for the org, which is the band with
        the org's overrides in force applied; those overrides, each with its
        end, so the page marks what is the organization's agreement; and the
        org's current usage of the limits the template counts itself (users:
        active members). A product's own limits have no usage here; the
        product counts them. Everything is read at the moment of the
        request, never cached; the gate is the action itself, which reads
        the plan again.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The plan and the usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPlan'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: changePlan
      summary: Move the organization to another plan (platform operators, until billing)
      description: |
        Audited on the org. A downgrade closes doors going forward and never
        deletes anything or removes anyone; the checklist of what stops is
        at GET /plan-change. Limits are read at the moment of every action,
        so the change takes effect on the next attempt with no sign-out.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  $ref: '#/components/schemas/Plan'
      responses:
        '200':
          description: The organization on its new plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/close:
    post:
      operationId: closeOrganization
      summary: Close the organization; it is deleted 30 days later (the Owner, or a platform operator with a reason)
      description: |
        Nothing is deleted now. Every session in the org ends within a
        minute, sign-in is refused with a message that it is closing, and its
        paid subscription is cancelled. For 30 days an Owner can reopen it
        from the link emailed when it closed, and everything comes back. After
        that the daily loop purges every record and file, service by service,
        checks each is empty, and keeps only the fact that the org existed.
        The Owner types the organization's name to confirm.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name:
                  type: string
                  maxLength: 200
                reason:
                  type: string
                  maxLength: 500
                  description: Why, for the audit log. Required of a platform operator.
      responses:
        '200':
          description: The organization, now closing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/reopen:
    post:
      operationId: reopenOrganization
      summary: Reopen a closing organization with the emailed link (public; the link is the proof)
      tags: [organizations]
      security: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Reopened
          content:
            application/json:
              schema:
                type: object
                required: [org_id, status]
                properties:
                  org_id:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/OrganizationStatus'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/reopen-link:
    post:
      operationId: requestReopenLink
      summary: Email a fresh reopen link to a closing organization's Owner (public; always accepted)
      description: What the sign-in page offers when it says an organization is closing. The answer is the same whether or not anything was sent.
      tags: [organizations]
      security: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '202':
          description: Accepted
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/retention:
    get:
      operationId: getRetention
      summary: What the platform keeps of this organization, and for how long
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The schedule that applies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retention'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setRetention
      summary: Change the organization's audit log retention (platform operators; beyond 13 months on enterprise only)
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audit_months]
              properties:
                audit_months:
                  type: integer
                  minimum: 13
                  maximum: 84
      responses:
        '200':
          description: The schedule as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retention'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/exports:
    post:
      operationId: createOrgExport
      summary: Ask for an export of everything the organization has (Owners)
      description: Produced within the hour by the daily loop's export pass, and emailed as a download link that lasts 7 days.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listOrgExports
      summary: The organization's recent exports (Owners)
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/exports:
    post:
      operationId: createPersonalExport
      summary: Ask for an export of everything about me, across every organization
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listPersonalExports
      summary: My recent exports
      tags: [organizations]
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/status:
    put:
      operationId: setOrganizationStatus
      summary: Suspend or reactivate the organization (platform operators)
      description: |
        Suspension keeps every record and removes nobody. Members cannot get
        a session in a suspended org: open sessions move elsewhere or to the
        chooser at their next refresh. Audited on the org with the reason.
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrganizationStatus'
                reason:
                  type: string
                  maxLength: 500
                  description: Why, for the audit log. Required to suspend.
      responses:
        '200':
          description: The organization as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/plan-change:
    get:
      operationId: previewPlanChange
      summary: What a move to another plan would close, for the admin to confirm
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: plan
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Plan'
      responses:
        '200':
          description: The checklist. Empty consequences means nothing closes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChange'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/plan-overrides:
    get:
      operationId: listPlanOverrides
      summary: Every override set for the organization, in force or ended (platform operators)
      description: |
        A platform operator's exceptions to the org's band, for an
        enterprise deal: a limit's cap raised or lowered, a feature granted
        or taken away, each with an optional end. One past its end has
        stopped applying and is listed with in_force false until it is
        removed or set again; nothing sweeps it.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The overrides, limits first, each by key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOverrideList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/plan-overrides/{kind}/{key}:
    put:
      operationId: setPlanOverride
      summary: Set the organization's override of one limit or feature (platform operators)
      description: |
        Replaces any override of the same limit or feature. The key must be
        a registered limit (with cap) or feature (with allowed). Checked at
        the moment of every action like the band itself: the band's value
        first, then this. Audited on the org as
        organization.plan.override_set, which the org's audit log shows.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/OverrideKind'
        - $ref: '#/components/parameters/OverrideKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanOverrideInput'
      responses:
        '200':
          description: The override as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOverride'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removePlanOverride
      summary: Remove the organization's override of one limit or feature (platform operators)
      description: |
        The band's value applies again from the next action. Audited on the
        org as organization.plan.override_removed.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/OverrideKind'
        - $ref: '#/components/parameters/OverrideKey'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/signups:
    post:
      operationId: startSignup
      summary: Sign up to create an organization
      description: |
        No sales call: an email, a name, the organization's name and time
        zone. The address must be proven before anything is created, so a
        link is emailed; nothing else happens until it is used. Needs a
        CAPTCHA token. An address at a domain another organization has
        claimed is refused and pointed at requesting access instead; a
        public mailbox domain (gmail.com and the like) claims nothing.
        Always 202 otherwise: whether an address was sent a link lately is
        not something this endpoint tells, and a person gets a few an hour.
      security: []
      tags: [signups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSignup'
      responses:
        '202':
          description: A link is on its way
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: The CAPTCHA check did not pass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another organization has claimed the address's domain; request access to it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/signups/complete:
    post:
      operationId: completeSignup
      summary: "Use the link: prove the address and create the organization"
      description: |
        One use. The organization is created with the signer-up as its
        Owner, the domain claimed when it is not a public mailbox
        provider, and a local account started as verified. The answer
        carries the token for setting the first password.
      security: []
      tags: [signups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupCompleted'
        '404':
          description: Not an open signup; the code says whether it was used or has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The domain was claimed by another organization meanwhile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/domain:
    get:
      operationId: getDomain
      summary: The organization's domain claim and how to prove a pending one
      security:
        - bearer: []
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainClaim'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: setDomain
      summary: Start claiming a domain
      description: |
        The Owner only (`claim_domain`; an Admin is refused 403). The domain
        waits until a TXT record proves it (`POST …/domain/verify`); until
        then it counts for nothing. A
        domain another organization holds is refused. A platform operator
        may set a domain directly through the organization's settings.
      security:
        - bearer: []
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  maxLength: 253
      responses:
        '200':
          description: The claim, pending, with the record to publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainClaim'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Another organization has claimed this domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/domain/verify:
    post:
      operationId: verifyDomain
      summary: Look for the TXT record and claim the pending domain
      description: The Owner only (`claim_domain`; an Admin is refused 403), as starting the claim is.
      security:
        - bearer: []
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainClaim'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: No domain is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The record was not found, or another organization claimed the domain meanwhile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/domains/{domain}/organization:
    get:
      operationId: getOrganizationByDomain
      summary: The organization that claimed an email domain (services only)
      description: |
        The identity service resolves which org's identity provider a person
        signs in through from the domain of the address they typed.
      tags: [organizations]
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
            maxLength: 253
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/organizations/{org_id}:
    get:
      operationId: getOrganizationInternal
      summary: An organization's record, for a service acting on its behalf (services only)
      description: The name for an email sent on the org's behalf, the time zone for a schedule, the plan for a gate.
      tags: [internal]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/organizations/{org_id}/plan:
    put:
      operationId: setPlanInternal
      summary: Move the organization to another plan (the billing service only)
      description: |
        Billing's path to the plan: an upgrade, a downgrade, a trial's start
        or end, a payment failure. Audited on the org with the reason. An
        enterprise org is a platform operator's to move, never billing's.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, reason]
              properties:
                plan:
                  $ref: '#/components/schemas/Plan'
                reason:
                  type: string
                  enum: [upgrade, downgrade, trial_start, trial_end, payment_failure, subscription]
      responses:
        '200':
          description: The plan and its limits, after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimits'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: getPlan
      summary: The org's plan and its limits, for a service gating an action (services only)
      description: |
        Read at the moment of the action, never cached. The band, what the
        org may do with its overrides in force applied, and those overrides,
        so a service checks the band's value then the override, and refuses
        with a message that names the plan and the next one up.
      tags: [plans]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The plan and its limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimits'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/organizations/{org_id}/data-keys/current:
    get:
      operationId: getCurrentDataKey
      summary: The org's current wrapped data key (services that may decrypt only)
      tags: [data-keys]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The wrapped key. Unwrapping it is KMS's decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedDataKey'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/organizations/{org_id}/data-keys/{version}:
    get:
      operationId: getDataKeyVersion
      summary: One version of the org's wrapped data key
      tags: [data-keys]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The wrapped key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedDataKey'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/internal/organizations/{org_id}/data-keys/rotate:
    post:
      operationId: rotateDataKey
      summary: Add a new data key version for the org (audited)
      description: |
        The new version becomes current; earlier versions stay readable until
        every secret written under them has been re-encrypted. Services only,
        until the platform admin role exists.
      tags: [data-keys]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '201':
          description: The new current key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrappedDataKey'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/onboarding:
    get:
      operationId: getOnboarding
      summary: The organization's first-run checklist, as it stands now
      description: |
        Every registered step, the core's then the product's, each derived
        now from the data that says whether it is done; nothing is a stored
        flag. Each step's service is asked at once, within two seconds: one
        that does not answer leaves its step unknown, never the checklist
        failed. Dismissals are the organization's. Needs the settings
        permission (an Owner or an Admin).
      security:
        - bearer: []
      tags: [onboarding]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The checklist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/onboarding/dismissal:
    post:
      operationId: dismissOnboarding
      summary: Hide the whole checklist for the organization
      description: Needs the settings permission. Audited (onboarding.dismissed).
      security:
        - bearer: []
      tags: [onboarding]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '204':
          description: Hidden
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: restoreOnboarding
      summary: Show the checklist again
      description: Needs the settings permission. Audited (onboarding.restored).
      security:
        - bearer: []
      tags: [onboarding]
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '204':
          description: Shown
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/organizations/{org_id}/onboarding/steps/{step_id}/dismissal:
    post:
      operationId: dismissOnboardingStep
      summary: Hide one step for the organization
      description: Needs the settings permission. Audited (onboarding.step_dismissed).
      security:
        - bearer: []
      tags: [onboarding]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/StepId'
      responses:
        '204':
          description: Hidden
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: restoreOnboardingStep
      summary: Show one step again
      description: Needs the settings permission. Audited (onboarding.step_restored).
      security:
        - bearer: []
      tags: [onboarding]
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/StepId'
      responses:
        '204':
          description: Shown
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Issued by the identity service (the local stub issuer in development).
        Scoped to one org; a token for another org is refused with 403.
  parameters:
    StepId:
      name: step_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 51
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A key the client makes up once per intended create and reuses on
        every retry of it. A second request with the same key returns what
        the first one made.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    OrgId:
      name: org_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OverrideKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [limit, feature]
    OverrideKey:
      name: key
      in: path
      required: true
      description: A registered limit's or feature's key, validated against the plan registry.
      schema:
        type: string
        minLength: 1
        maxLength: 100
  responses:
    Error:
      description: The error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    WrappedDataKey:
      type: object
      required: [org_id, version, wrapped_key, kms_key_version]
      properties:
        org_id:
          type: string
          format: uuid
        version:
          type: integer
        wrapped_key:
          type: string
          format: byte
          description: The data key, encrypted by the KMS master key. Useless without KMS.
        kms_key_version:
          type: string
    Plan:
      type: string
      description: The plan band, one of the bands the deployment registers (free, team, business and enterprise unless the product names others). What each band allows is read at the moment of every action.
    PlanLimits:
      type: object
      required: [org_id, plan, contractual, limits, features, overrides]
      properties:
        org_id:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/Plan'
        contractual:
          type: boolean
          description: Sold by contract rather than self-serve; billing never moves an organization into or out of it.
        limits:
          type: object
          description: Every registered limit and its effective cap for this org, by key (users is the one every deployment has), its override's where one is in force, else the band's. 0 means no cap in the product.
          additionalProperties:
            type: integer
        features:
          type: array
          description: The gated features on for this org, the band's with its overrides applied. Everything not gated is on every plan.
          items:
            type: string
        overrides:
          type: array
          description: |
            The org's overrides in force now, which limits and features
            already include. A gate checks the band's value first, then
            these.
          items:
            $ref: '#/components/schemas/PlanOverride'
    PlanOverride:
      type: object
      required: [kind, key, in_force]
      properties:
        kind:
          type: string
          enum: [limit, feature]
        key:
          type: string
          description: The registered limit's or feature's key.
        cap:
          type: integer
          description: For a limit, the cap that replaces the band's. 0 means no cap.
        allowed:
          type: boolean
          description: For a feature, whether it is granted (true) or taken away (false), whatever the band says.
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: When the override stops applying; absent or null is never.
        in_force:
          type: boolean
          description: Whether it applies now. One past its end has stopped.
    PlanOverrideInput:
      type: object
      properties:
        cap:
          type: integer
          minimum: 0
          description: For a limit, the cap. 0 lifts it.
        allowed:
          type: boolean
          description: For a feature, grant (true) or take away (false).
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: When it stops applying, in the future; absent or null is never.
    PlanOverrideList:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/PlanOverride'
    PlanCatalogue:
      type: object
      required: [bands, limits, features]
      properties:
        bands:
          type: array
          description: Every registered band, lowest first.
          items:
            $ref: '#/components/schemas/PlanBand'
        limits:
          type: array
          description: Every registered limit, in registration order (users first).
          items:
            $ref: '#/components/schemas/PlanLimitInfo'
        features:
          type: array
          description: Every gated feature, in registration order. Anything not listed is on every plan.
          items:
            $ref: '#/components/schemas/PlanFeatureInfo'
    PlanBand:
      type: object
      required: [name, label, contractual, limits, features]
      properties:
        name:
          $ref: '#/components/schemas/Plan'
        label:
          type: string
          description: What a page calls the band, such as Team.
        contractual:
          type: boolean
          description: Sold by contract rather than self-serve; billing never moves an organization into or out of it.
        limits:
          type: object
          description: Every registered limit's cap on this band, by key. 0 means no cap.
          additionalProperties:
            type: integer
        features:
          type: array
          description: The gated features this band includes, by key.
          items:
            type: string
    PlanLimitInfo:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
          description: The plural noun a message uses, such as users.
    PlanFeatureInfo:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
        label:
          type: string
          description: What a message calls it, such as SCIM provisioning.
    OrganizationPlan:
      type: object
      required: [org_id, plan, label, contractual, limits, features, overrides, usage]
      properties:
        org_id:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/Plan'
        label:
          type: string
          description: The band's label.
        contractual:
          type: boolean
        limits:
          type: object
          description: Every registered limit's effective cap for this org, by key, its override's where it has one in force, else the band's. 0 means no cap.
          additionalProperties:
            type: integer
        features:
          type: array
          description: The gated features on for this org, by key, the band's with its overrides applied.
          items:
            type: string
        overrides:
          type: array
          description: The overrides in force now, limits first, each by key, with its end. The billing page marks these limits and features as the organization's agreement; the band's own values are in the catalogue.
          items:
            $ref: '#/components/schemas/PlanOverride'
        usage:
          type: object
          description: What the org uses now of each limit the template counts, by key (users, its active members). A product's own limits are absent; the product counts them.
          additionalProperties:
            type: integer
    PlanChange:
      type: object
      required: [from, to, downgrade, consequences]
      properties:
        from:
          $ref: '#/components/schemas/Plan'
        to:
          $ref: '#/components/schemas/Plan'
        downgrade:
          type: boolean
        consequences:
          type: array
          items:
            $ref: '#/components/schemas/PlanConsequence'
    PlanConsequence:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable; the admin page keys its explanation on it.
        message:
          type: string
    TimeZone:
      type: string
      description: |
        IANA time zone name, such as Asia/Kolkata. Never an offset. This is
        the organization's zone: scheduled switches and grace periods use
        it. A person's own zone is on their profile.
      example: Asia/Kolkata
      maxLength: 64
    NewOrganization:
      type: object
      required: [name, time_zone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: What people see in the product. Defaults to the name.
        domain:
          type: string
          minLength: 3
          maxLength: 253
          description: The email domain the organization claims, such as acme.com. One organization per domain.
        time_zone:
          $ref: '#/components/schemas/TimeZone'
        owner_user_id:
          type: string
          format: uuid
          description: The first owner. Set when the person exists already; self-serve signup sets it to the signer-up.
    NewSignup:
      type: object
      required: [email, name, org_name, time_zone]
      properties:
        email:
          type: string
          maxLength: 320
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The signer-up's own name.
        org_name:
          type: string
          minLength: 1
          maxLength: 200
        time_zone:
          $ref: '#/components/schemas/TimeZone'
    SignupCompleted:
      type: object
      required: [org_id, user_id, membership_id, domain_claimed]
      properties:
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        domain_claimed:
          type: boolean
          description: Whether the address's domain is now the organization's.
        setup_token:
          type: string
          description: For setting the first password with the identity service; one use, fifteen minutes.
    DomainClaim:
      type: object
      required: [verified]
      properties:
        domain:
          type: string
          description: The claimed domain, when one is.
        verified_at:
          type: string
          format: date-time
        verified:
          type: boolean
        pending_domain:
          type: string
        txt_name:
          type: string
          description: The DNS name to publish the record at, for a pending domain.
        txt_value:
          type: string
          description: The record's value.
    OrganizationSettings:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        display_name:
          type: string
          maxLength: 200
          nullable: true
        domain:
          type: string
          maxLength: 253
          nullable: true
        time_zone:
          $ref: '#/components/schemas/TimeZone'
    OrganizationStatus:
      type: string
      enum: [active, suspended, closing]
    Retention:
      type: object
      required: [classes, audit_months, audit_configurable]
      properties:
        audit_months:
          type: integer
          description: How long the audit log is kept, in months.
        audit_configurable:
          type: boolean
          description: Whether a platform operator may lengthen it (enterprise).
        classes:
          type: array
          items:
            type: object
            required: [class, kept]
            properties:
              class:
                type: string
                enum: [identity, audit, transient, backups]
              kept:
                type: string
                description: How long, in words, the same every time for every org.
    DataExport:
      type: object
      required: [id, kind, status, requested_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [organization, personal]
        status:
          type: string
          enum: [pending, ready, failed, expired]
        requested_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        download_url:
          type: string
          description: While ready, a link that works for an hour. The same link is emailed for 7 days.
        blocked_by:
          type: string
          description: >-
            The service whose part the last attempt could not gather. Pending,
            it is retried within the hour; after three attempts the export is
            failed. Absent once the export is made.
    DataExportList:
      type: object
      required: [exports]
      properties:
        exports:
          type: array
          items:
            $ref: '#/components/schemas/DataExport'
    Organization:
      type: object
      required: [org_id, name, plan, status, time_zone, created_at, last_modified_at]
      properties:
        org_id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
          description: Present when it differs from the name.
        domain:
          type: string
        plan:
          $ref: '#/components/schemas/Plan'
        user_cap:
          type: integer
          description: Active members the plan allows. Absent on a plan with no cap.
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        suspended_at:
          type: string
          format: date-time
        suspension_reason:
          type: string
        closing_at:
          type: string
          format: date-time
          description: When it was closed; present while it is closing.
        purge_after:
          type: string
          format: date-time
          description: When everything in it is deleted; present while it is closing.
        time_zone:
          $ref: '#/components/schemas/TimeZone'
        owner_user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_modified_at:
          type: string
          format: date-time
    OrganizationPage:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: string
          description: Present when there is another page.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable. Clients branch on this.
          example: organization.not_found
        message:
          type: string
          description: For a person. Never parsed.
        fields:
          type: object
          additionalProperties:
            type: string
          description: The inputs that were wrong, when there were any.
    Onboarding:
      type: object
      required: [org_id, dismissed, complete, steps]
      properties:
        org_id:
          type: string
          format: uuid
        dismissed:
          type: boolean
          description: The whole checklist is hidden for the organization.
        complete:
          type: boolean
          description: Every step is done or dismissed, and none is unknown.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
    OnboardingStep:
      type: object
      required: [id, label, href, app, done, dismissed, unknown]
      properties:
        id:
          type: string
          description: Stable; the core's are verify_domain, invite_teammates, set_up_sso and choose_plan, and a product adds its own. Not an enum.
        label:
          type: string
        href:
          type: string
          description: Where the step is done, a path in app.
        app:
          type: string
          description: The web app href is in, by name (admin unless the step says otherwise).
        done:
          type: boolean
          description: Derived now from the organization's data. False when unknown.
        dismissed:
          type: boolean
        unknown:
          type: boolean
          description: The service that knows did not answer in time; done is not known.
