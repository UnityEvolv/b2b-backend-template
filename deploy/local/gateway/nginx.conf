# The local API gateway: one origin for every service, routed by path
# prefix with the prefix stripped, as the deployed load balancer does
# (deploy/terraform/ingress.tf). /identity/v1/jwks reaches the identity
# service as /v1/jwks. A new service is one more name in the map below.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  server_tokens off;
  client_max_body_size 20m;

  # Docker's resolver, asked at request time: a service that restarts, or
  # starts after the gateway, is found at its new address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $uri $service {
    ~^/(identity|organization|user|authorization|audit|notification|billing)(/|$) $1;
    default "";
  }

  server {
    listen 8080;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    location / {
      if ($service = "") {
        return 404;
      }
      rewrite ^/[^/]+/?(.*)$ /$1 break;
      proxy_pass http://$service:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Server-Sent Events (GET /identity/v1/session/events): each event is
      # passed on as it comes, and an idle stream is kept open.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
